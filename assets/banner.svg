<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0a122c"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Pattern -->
    <pattern id="medicalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseAnim {
        0% { stroke-dashoffset: 1600; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes orbBreath {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .animated-ecg {
        stroke-dasharray: 400 80;
        animation: pulseAnim 8s linear infinite;
      }
      .floating-pill-1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatCard2 6s ease-in-out infinite 0.8s;
      }
      .floating-pill-3 {
        animation: floatCard3 5.5s ease-in-out infinite 1.5s;
      }
      .breathing-orb {
        transform-origin: center;
        animation: orbBreath 7s ease-in-out infinite alternate;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .font-mono {
        font-family: "SF Mono", "Consolas", "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.2px;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#medicalGrid)"/>

  <!-- Ambient Light Orbs (Dynamic Background) -->
  <circle cx="240" cy="140" r="280" fill="url(#glowCyan)" class="breathing-orb"/>
  <circle cx="980" cy="280" r="260" fill="url(#glowPurple)" class="breathing-orb"/>
  <circle cx="600" cy="380" r="200" fill="url(#glowEmerald)" class="breathing-orb"/>

  <!-- Subtle Ambient ECG Pulse Wave (Behind content, low z-index) -->
  <g opacity="0.45" filter="url(#neonGlow)">
    <path class="animated-ecg" fill="none" stroke="url(#ecgGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      d="M 0 310 L 180 310 L 210 310 L 225 285 L 240 335 L 255 250 L 275 365 L 295 300 L 315 310 L 480 310 
         L 510 310 L 525 285 L 540 335 L 555 240 L 575 375 L 595 295 L 615 310 L 780 310 
         L 810 310 L 825 285 L 840 335 L 855 245 L 875 370 L 895 298 L 915 310 L 1080 310 
         L 1110 310 L 1125 285 L 1140 335 L 1155 250 L 1175 365 L 1200 310" />
  </g>

  <!-- Decorative Corner Health Nodes -->
  <g opacity="0.35" transform="translate(60, 45)">
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <circle cx="20" cy="10" r="2" fill="#818cf8"/>
    <circle cx="10" cy="25" r="2" fill="#34d399"/>
    <line x1="0" y1="0" x2="20" y2="10" stroke="#38bdf8" stroke-width="0.75"/>
    <line x1="20" y1="10" x2="10" y2="25" stroke="#818cf8" stroke-width="0.75"/>
    <line x1="0" y1="0" x2="10" y2="25" stroke="#34d399" stroke-width="0.75"/>
  </g>

  <g opacity="0.35" transform="translate(1120, 50)">
    <circle cx="0" cy="0" r="3" fill="#c084fc"/>
    <circle cx="-18" cy="12" r="2" fill="#38bdf8"/>
    <circle cx="-8" cy="26" r="2" fill="#34d399"/>
    <line x1="0" y1="0" x2="-18" y2="12" stroke="#c084fc" stroke-width="0.75"/>
    <line x1="-18" y1="12" x2="-8" y2="26" stroke="#38bdf8" stroke-width="0.75"/>
    <line x1="0" y1="0" x2="-8" y2="26" stroke="#34d399" stroke-width="0.75"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <rect x="-215" y="-15" width="430" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <text y="5" fill="#38bdf8" class="font-mono" text-anchor="middle">✦ ENTERPRISE HEALTHCARE CRM ECOSYSTEM ✦</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Always clear and visible) -->
  <g transform="translate(600, 150)" text-anchor="middle" filter="url(#shadowFilter)">
    <text class="font-title" font-size="44" fill="url(#titleGrad)" text-anchor="middle">
      Awesome Enterprise Healthcare CRM
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <text class="font-sub" font-size="17" fill="#94a3b8" text-anchor="middle">
      Curated Directory of Enterprise SaaS Solutions, Open-Source Repositories &amp; Patient Systems
    </text>
    <text class="font-sub" font-size="14.5" fill="#64748b" text-anchor="middle" y="26">
      Patient Engagement • Care Coordination • Clinical Marketing • FHIR R4 &amp; HIPAA Interoperability
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Floating Interactive Feature Badges -->
  <g transform="translate(140, 275)" class="floating-pill-1">
    <rect width="200" height="42" rx="21" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45" filter="url(#shadowFilter)"/>
    <circle cx="22" cy="21" r="7" fill="#0284c7" fill-opacity="0.3"/>
    <text x="22" y="25" text-anchor="middle" font-size="12">🏥</text>
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Enterprise Health SaaS</text>
  </g>

  <g transform="translate(385, 275)" class="floating-pill-2">
    <rect width="205" height="42" rx="21" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45" filter="url(#shadowFilter)"/>
    <circle cx="22" cy="21" r="7" fill="#059669" fill-opacity="0.3"/>
    <text x="22" y="25" text-anchor="middle" font-size="12">🔓</text>
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Open-Source &amp; Self-Hosted</text>
  </g>

  <g transform="translate(635, 275)" class="floating-pill-3">
    <rect width="195" height="42" rx="21" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.45" filter="url(#shadowFilter)"/>
    <circle cx="22" cy="21" r="7" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="22" y="25" text-anchor="middle" font-size="12">🔒</text>
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">HIPAA &amp; FHIR R4 Ready</text>
  </g>

  <g transform="translate(875, 275)" class="floating-pill-1">
    <rect width="185" height="42" rx="21" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.45" filter="url(#shadowFilter)"/>
    <circle cx="22" cy="21" r="7" fill="#9333ea" fill-opacity="0.3"/>
    <text x="22" y="25" text-anchor="middle" font-size="12">🤖</text>
    <text x="40" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">AI Agents &amp; Patient 360</text>
  </g>

  <!-- Bottom Metric / Status Pill -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="-215" cy="0" r="4" fill="#10b981"/>
    <text x="-195" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="start">
      Continually Updated • Production Benchmarks • Community Verified
    </text>
  </g>

  <!-- Border Frame -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
</svg>
